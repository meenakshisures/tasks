<div class="form-header">
  <h2>Reactive Form</h2>
</div>
<div class="form-container">
  <form [formGroup]="userForm">
    <!-- Username Field -->
    <div class="form-row">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Username</mat-label>
        <input matInput formControlName="username" />
      </mat-form-field>
    </div>

    <!-- Email Field -->
    <div class="form-row">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" />
      </mat-form-field>
    </div>

    <!-- Password Field -->
    <div class="form-row">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password" />
        <mat-error *ngIf="userForm.controls['password'].invalid && userForm.controls['password'].touched">
          <ng-container *ngIf="userForm.controls['password'].errors?.required">Password is required.</ng-container>
          <ng-container *ngIf="userForm.controls['password'].errors?.minlength || userForm.controls['password'].errors?.maxlength">
            Password must be exactly 8 characters long.
          </ng-container>
          <ng-container *ngIf="userForm.controls['password'].errors?.pattern">
            Password must contain only letters and numbers (no special characters).
          </ng-container>
        </mat-error>
      </mat-form-field>
    </div>

    <!-- Age Field -->
    <div class="form-row">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Age</mat-label>
        <input matInput type="number" formControlName="age" />
      </mat-form-field>
    </div>

    <!-- Gender Field -->
    <div class="form-row">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Gender</mat-label>
        <mat-select formControlName="gender" (selectionChange)="onGenderChange($event)">
          <mat-option value="" disabled>Select Gender</mat-option>
          <mat-option value="male">Male</mat-option>
          <mat-option value="female">Female</mat-option>
          <mat-option value="other">Other</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <!-- Buttons -->
    <div class="form-row">
      <button mat-raised-button color="primary" type="submit" [disabled]="userForm.invalid" (click)="onRegister()">Register</button>
      <button mat-raised-button color="warn" type="reset" (click)="onCancel()">Cancel</button>
    </div>
  </form>
</div>
